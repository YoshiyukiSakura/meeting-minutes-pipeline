name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  light-unit-tests:
    name: Lightweight unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run unit tests without Apple Silicon runtime dependencies
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-project --with pytest --with numpy --with pillow pytest -q
