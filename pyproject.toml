[project]
name = "meeting-minutes-pipeline"
version = "0.1.0"
description = "Local-first pipeline for meeting minutes from flattened video-call recordings."
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "mlx-whisper>=0.4.2",
  "numpy>=2.0.0",
  "pillow>=10.4.0",
  "scipy>=1.14.0",
  "speechbrain>=1.1.0",
  "torchaudio>=2.11.0",
]

[project.optional-dependencies]
diarization = [
  "pyannote.audio>=3.3.0",
]

[project.scripts]
meeting-minutes = "meeting_minutes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_minutes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
